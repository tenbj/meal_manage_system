<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 小饭桌</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#223c34;font:16px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}main{display:grid;grid-template-columns:1fr 1fr;width:min(960px,100%);background:#fff;border:1px solid #e3e8de;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px #17392a0b}.intro{padding:60px 44px;background:#e9efdf;display:flex;flex-direction:column;justify-content:center}.brand{font-weight:750;letter-spacing:.08em;font-size:18px}.intro h1{font-size:38px;line-height:1.3;margin:48px 0 18px}.intro p{color:#5a6a5c;max-width:300px}.illustration{font-size:64px;margin-top:28px}.panel{padding:48px 44px}.tabs{display:flex;border-bottom:1px solid #e3e8de;margin-bottom:30px;gap:26px}.tabs button{border:0;background:none;border-radius:0;padding:12px 0;color:#728077;font-size:18px;min-height:48px}.tabs button[aria-selected=true]{color:#274d3b;font-weight:700;border-bottom:3px solid #527a49}h2{font-size:24px;margin:0 0 6px}.hint{font-size:14px;color:#718077;margin:0 0 22px}label{display:block;font-size:14px;margin:16px 0 6px}input{display:block;width:100%;min-height:46px;padding:11px 12px;border:1px solid #cdd6cc;border-radius:9px;font-size:16px;background:#fff;color:inherit}input:focus{outline:3px solid #dce8ce;border-color:#63845a}.pw{position:relative}.pw input{padding-right:60px}.pw button{position:absolute;right:5px;top:3px;background:none;border:0;color:#537044;padding:10px;min-height:40px}.submit{width:100%;margin-top:24px;border:0;border-radius:10px;background:#3f6345;color:#fff;padding:12px;font-weight:650;font-size:16px;min-height:48px;cursor:pointer}button:disabled{opacity:.6}button{cursor:pointer}small{display:block;color:#718077;margin-top:6px;font-size:12px}.error{color:#a83229;font-size:14px;min-height:24px;margin:12px 0 0}.foot{font-size:12px;text-align:center;color:#718077;margin-top:20px}[hidden]{display:none!important}@media(max-width:680px){body{padding:16px;display:block}main{display:block;border-radius:20px}.intro{padding:25px 26px}.intro h1{font-size:26px;margin:14px 0 6px}.intro p{margin:0;max-width:none}.illustration{display:none}.panel{padding:24px 26px}.tabs{margin-bottom:24px}.intro .brand{font-size:16px}}
</style></head><body><main><section class="intro"><div class="brand">小饭桌 / MEAL DESK</div><h1>把每一餐，<br>安排得刚刚好。</h1><p>从客户档案到每日出餐，<br>在自己的工作台里，有序照顾每一份餐。</p><div class="illustration" aria-hidden="true">🥗</div></section><section class="panel"><div class="tabs" role="tablist" aria-label="账号访问"><button id="login-tab" role="tab" aria-selected="true" aria-controls="access-panel" data-event-id="auth.login-tab">登录</button><button id="register-tab" role="tab" aria-selected="false" aria-controls="access-panel" tabindex="-1" data-event-id="auth.register-tab">注册</button></div><div id="access-panel" role="tabpanel" aria-labelledby="login-tab"><h2 id="heading">欢迎回来</h2><p class="hint" id="hint">登录后继续管理你的小饭桌。</p><form id="access-form"><div id="display-row" hidden><label for="displayName">昵称</label><input id="displayName" name="displayName" autocomplete="nickname" maxlength="80"></div><label for="username">用户名</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="32" pattern="[a-zA-Z][a-zA-Z0-9_]{2,31}" aria-describedby="username-help"><small id="username-help">3–32位字母、数字或下划线，以字母开头</small><label for="password">密码</label><div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="button" id="show-password" aria-label="显示密码" data-event-id="auth.show-password">显示</button></div><small id="password-help" hidden>至少12个字符，建议使用一组容易记住的长密码。</small><div id="confirm-row" hidden><label for="confirm">确认密码</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128"></div><p class="error" id="error" role="alert"></p><button class="submit" id="submit" data-event-id="auth.submit">登录</button></form></div><p class="foot" id="foot">登录后可保持7天，随时从账号菜单退出。</p></section></main><script>
(()=>{let mode='login';const $=id=>document.getElementById(id),tabs=[$('login-tab'),$('register-tab')];function select(next){mode=next;tabs.forEach((t,i)=>{const active=(i===0?'login':'register')===mode;t.setAttribute('aria-selected',active);t.tabIndex=active?0:-1});$('access-panel').setAttribute('aria-labelledby',mode+'-tab');const registering=mode==='register';['display-row','confirm-row','password-help'].forEach(id=>$(id).hidden=!registering);$('confirm').required=registering;$('password').minLength=registering?12:1;$('password').autocomplete=registering?'new-password':'current-password';$('heading').textContent=registering?'开一张自己的小饭桌':'欢迎回来';$('hint').textContent=registering?'新账号拥有独立的客户、菜品和出餐记录。':'登录后继续管理你的小饭桌。';$('submit').textContent=registering?'注册并进入':'登录';$('foot').textContent=registering?'已有账号？切换到登录即可。':'登录后可保持7天，随时从账号菜单退出。';$('error').textContent='';document.title=(registering?'注册':'登录')+' · 小饭桌'}tabs.forEach((t,i)=>{t.onclick=()=>select(i?'register':'login');t.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?1:1-i;select(next?'register':'login');tabs[next].focus()}}});$('show-password').onclick=()=>{const show=$('password').type==='password';$('password').type=show?'text':'password';$('show-password').textContent=show?'隐藏':'显示';$('show-password').setAttribute('aria-label',show?'隐藏密码':'显示密码')};$('access-form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';if(mode==='register'&&$('password').value!==$('confirm').value){$('error').textContent='两次输入的密码不一致';$('confirm').focus();return}const b=$('submit');b.disabled=true;try{const r=await fetch('/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value,...(mode==='register'?{displayName:$('displayName').value||$('username').value}:{})})});const result=await r.json();if(!r.ok)throw Error(result.message||'暂时无法登录，请稍后重试');location.assign('/')}catch(e){$('error').textContent=e.message||'连接失败，请稍后重试'}finally{b.disabled=false}}})();
</script></body></html>
