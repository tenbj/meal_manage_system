services:
  app:
    build: .
    image: ${MEAL_IMAGE:-meal-management:0.3.0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3200}:3200"
    environment:
      PORT: "3200"
      AUTO_MIGRATE: "false"
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Set APP_ACCESS_TOKEN}
      APP_READ_TOKEN: ${APP_READ_TOKEN:?Set APP_READ_TOKEN}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3200}
      BOOHEE_API_KEY: ${BOOHEE_API_KEY:-}
    volumes:
      - runtime:/app/.runtime
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  runtime:
