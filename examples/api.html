<!doctype html><meta charset="utf-8"><title>餐食 API 示例</title><h1>工作台读取示例</h1><p>在系统同源且登录后打开，通过 Cookie 读取，不内置令牌。</p><button id="read">读取版本</button><pre id="result"></pre><script>document.querySelector('#read').onclick=async()=>{const r=await fetch('/api/merchant');document.querySelector('#result').textContent=r.ok?'revision: '+(await r.json()).revision:'读取失败: '+r.status;};</script>
